<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use the full iPhone screen; safe-area insets are handled in CSS.
         Pinch-zoom stays enabled for accessibility (inputs are 16px+, so iOS does not auto-zoom). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <!-- "Add to Home Screen" on iPhone opens the site like an app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chadrey" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Chadrey Wholesale</title>
    <meta
      name="description"
      content="Wholesale goods sourced directly from dealers in Thailand. Browse products, request a quote and track your import order." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- No web fonts on purpose: a font stylesheet in the head blocks the whole page until another server answers,
         which can mean a blank screen on a slow connection. Every device uses its own system font
         (SF Pro on iPhone and Mac, Roboto on Android, Segoe UI on Windows); see --font-sans in index.css. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
